quarkus.index-dependency.rimfrost-framework-regel-kommunicering.group-id=se.fk.rimfrost.framework.regel.kommunicering
quarkus.index-dependency.rimfrost-framework-regel-kommunicering.artifact-id=rimfrost-framework-regel-kommunicering
quarkus.index-dependency.rimfrost-referensdata-erbjudande.group-id=se.fk.rimfrost.referensdata
quarkus.index-dependency.rimfrost-referensdata-erbjudande.artifact-id=rimfrost-template-referensdata-erbjudande

# Container image configuration
# TODO: Change container image name to something unique for the rule
quarkus.container-image.name=rimfrost-template-regel-kommunicering

# Kafka setup
# TODO: Change kafka source & subtopic to something unique for the rule
kafka.source=RegelTemplateKommunicering
kafka.subtopic=regel-template-kommunicering

#Incoming
# TODO: Change request and cancelled topics to something unique for the rule
mp.messaging.incoming.regel-requests.topic=regel-template-kommunicering-requests
mp.messaging.incoming.operativt-uppgiftslager-status-notification.topic=operativt-uppgiftslager-status-notification.${kafka.subtopic}
kafka.cancelled.topic=regel-template-kommunicering-cancelled

#Outgoing
# TODO: Change response topic to something unique for the rule
mp.messaging.outgoing.regel-responses.topic=regel-template-kommunicering-responses

# Persistence
# TODO: Change schema and table-prefix to something unique for the rule
quarkus.flyway.default-schema=regel_template_kommunicering
regel.persistence.table-prefix=regel_template_kommunicering

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# REST setup
handlaggning.api.base-url=http://rimfrost-k8s-handlaggning:8080
oul.api.base-url=http://rimfrost-k8s-uppgiftslager:8080
sid.api.base-url=http://rimfrost-k8s-sid:8080